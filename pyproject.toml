[project]
name = "regocr"
version = "0.3.0"
description = "High-accuracy Arabic/English commercial registry OCR and structured extraction service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "easyocr>=1.7.2",
    "fastapi>=0.163.1",
    "jsonschema>=4.26.0",
    "numpy>=2.0.0",
    "opencv-python>=4.10.0",
    "paddleocr>=3.0",
    "paddlepaddle==3.2.0",
    "pdfplumber>=0.11.10",
    "pillow>=11.0.0",
    "pydantic>=2.0.0",
    "pypdfium2>=5.0.0",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.0.0",
    "reportlab>=5.1.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
regocr = "regocr.cli:main"
regocr-gui = "regocr.gui:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
paddlepaddle = { index = "paddle-cpu" }

[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true
