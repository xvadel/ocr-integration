[project]
name = "ocr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arabic-reshaper>=3.0.1",
    "easyocr>=1.7.2",
    "jsonschema>=4.26.0",
    "numpy>=2.5.4",
    "paddleocr>=2.10.0",
    "paddlepaddle==3.2.0",
    "pdfplumber>=0.11.10",
    "pillow>=13.0.0",
    "pymupdf>=2.0",
    "pytesseract>=0.3.13",
    "python-bidi>=0.6.12",
    "reportlab>=5.1.0",
]

[tool.uv.sources]
paddlepaddle = { index = "paddle-cpu" }

[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true
